name: pt-stalk-suggestion-lab
# Three Percona Server versions to generate pt-stalk captures for the
# pt-stalk-suggest tool. Synthetic data only.
services:
  ps57:
    image: percona/percona-server:5.7
    env_file: .env
    ports: ["127.0.0.1:33057:3306"]
    volumes: ["./conf/ps57.cnf:/etc/my.cnf.d/zz-lab.cnf:ro", "ps57data:/var/lib/mysql"]
    mem_limit: 1g
  ps80:
    image: percona/percona-server:8.0
    env_file: .env
    ports: ["127.0.0.1:33080:3306"]
    volumes: ["./conf/ps80.cnf:/etc/my.cnf.d/zz-lab.cnf:ro", "ps80data:/var/lib/mysql"]
    mem_limit: 1g
  ps84:
    image: percona/percona-server:8.4
    env_file: .env
    ports: ["127.0.0.1:33084:3306"]
    volumes: ["./conf/ps84.cnf:/etc/my.cnf.d/zz-lab.cnf:ro", "ps84data:/var/lib/mysql"]
    mem_limit: 1g
volumes:
  ps57data:
  ps80data:
  ps84data:
